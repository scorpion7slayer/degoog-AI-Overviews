<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{description}}">
    <title>{{title}} · degoog</title>
    <link rel="icon" href="{{basePath}}/public/favicon/favicon.ico" type="image/x-icon">
    <link rel="preload" href="{{basePath}}/public/themes/degoog-theme/fonts/google-sans/static/GoogleSans-Medium.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{basePath}}/public/themes/degoog-theme/style.css">
    <link rel="stylesheet" href="{{apiBase}}/mode.css">
    <script src="{{apiBase}}/mode.js" defer></script>
  </head>
  <body class="dgo-ai-mode-body">
    <header class="dgo-ai-mode-appbar">
      <a class="dgo-ai-mode-brand" href="{{basePath}}/" aria-label="{{backHome}}">
        <span class="dgo-ai-mode-brand-word" aria-hidden="true">
          <span>d</span><span>e</span><span>g</span><span>o</span><span>o</span><span>g</span>
        </span>
        <span class="dgo-ai-mode-badge">{{title}}</span>
      </a>

      <form class="dgo-ai-mode-query-form dgo-ai-mode-query-form--compact" data-mode-query-form hidden>
        <label class="dgo-ai-mode-visually-hidden" for="dgo-ai-mode-query-compact">{{askAnything}}</label>
        <textarea id="dgo-ai-mode-query-compact" rows="1" maxlength="512" placeholder="{{askAnything}}" data-mode-query-input></textarea>
        <button type="submit" aria-label="{{search}}">
          <span>{{search}}</span>
          <span aria-hidden="true">→</span>
        </button>
      </form>

      <a class="dgo-ai-mode-results-link" href="{{basePath}}/">{{classicSearch}}</a>
    </header>

    <main class="dgo-ai-mode-main">
      <section class="dgo-ai-mode-empty" data-mode-empty>
        <div class="dgo-ai-mode-empty-copy">
          <h1>{{emptyTitle}}</h1>
          <p>{{emptyDescription}}</p>
        </div>

        <form class="dgo-ai-mode-query-form dgo-ai-mode-query-form--hero" data-mode-query-form>
          <label class="dgo-ai-mode-visually-hidden" for="dgo-ai-mode-query-hero">{{askAnything}}</label>
          <textarea id="dgo-ai-mode-query-hero" rows="2" maxlength="512" placeholder="{{askAnything}}" data-mode-query-input></textarea>
          <button type="submit">
            <span>{{explore}}</span>
            <span aria-hidden="true">→</span>
          </button>
        </form>

        <div class="dgo-ai-mode-suggestions">
          <p>{{examples}}</p>
          <div aria-label="{{examples}}">
            <button type="button" data-mode-suggestion="{{exampleOne}}">{{exampleOne}}</button>
            <button type="button" data-mode-suggestion="{{exampleTwo}}">{{exampleTwo}}</button>
            <button type="button" data-mode-suggestion="{{exampleThree}}">{{exampleThree}}</button>
          </div>
        </div>
      </section>

      <section class="dgo-ai-mode-session" data-mode-session hidden>
        <header class="dgo-ai-mode-session-heading">
          <p>{{answerLabel}}</p>
          <h1 data-mode-question></h1>
          <span data-mode-provider></span>
        </header>

        <div class="dgo-ai-mode-layout">
          <article class="dgo-ai-mode-answer-column">
            <ul class="dgo-ai-mode-image-rail" data-mode-images hidden></ul>

            <div class="dgo-ai-mode-thinking" data-mode-thinking hidden>
              <span class="dgo-ai-mode-thinking-mark" aria-hidden="true"></span>
              <span>{{thinking}}</span>
              <span data-mode-thinking-text></span>
            </div>

            <div class="dgo-ai-mode-answer" data-mode-answer aria-live="polite" aria-busy="true"></div>

            <div class="dgo-ai-mode-error" data-mode-error role="alert" hidden>
              <div>
                <strong>{{errorTitle}}</strong>
                <span data-mode-error-message></span>
              </div>
              <button type="button" data-mode-retry>{{retry}}</button>
            </div>

            <div class="dgo-ai-mode-thread" data-mode-thread aria-live="polite"></div>
          </article>

          <aside class="dgo-ai-mode-sources" aria-label="{{sources}}">
            <details open>
              <summary>
                <span>{{sources}}</span>
                <span data-mode-source-count>0</span>
              </summary>
              <ol data-mode-source-list></ol>
            </details>
          </aside>
        </div>

        <form class="dgo-ai-mode-followup" data-mode-followup hidden>
          <label class="dgo-ai-mode-visually-hidden" for="dgo-ai-mode-followup-input">{{followUp}}</label>
          <textarea id="dgo-ai-mode-followup-input" rows="1" maxlength="4000" placeholder="{{followUp}}" data-mode-followup-input></textarea>
          <button type="submit" aria-label="{{send}}">
            <span>{{send}}</span>
            <span aria-hidden="true">↑</span>
          </button>
        </form>

        <p class="dgo-ai-mode-disclaimer">{{disclaimer}}</p>
      </section>
    </main>
  </body>
</html>
